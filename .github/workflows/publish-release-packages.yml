name: Publish Releases & GitHub Packages

on:
  release:
    types: [published, created]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag or version name (e.g. v3.0.0)'
        required: false
        default: 'v3.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build Distribution & Publish to GitHub Packages / Releases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Build & Publishing Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Wheel and Source Distribution
        run: |
          python -m build

      - name: Check Built Packages with Twine
        run: |
          twine check dist/*

      - name: Publish to GitHub Packages
        env:
          TWINE_USERNAME: ${{ github.actor }}
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TWINE_REPOSITORY_URL: https://pypi.pkg.github.com/${{ github.repository_owner }}
        run: |
          twine upload --skip-existing dist/* || echo "Package upload completed or version already exists."

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
